version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: shtab_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: shtab_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    restart: always

  backend:
    build: ./backend
    container_name: shtab_backend
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_NAME=shtab_db
      - DB_SSLMODE=disable
      - PORT=8080
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: always

  frontend:
    build: ./frontend
    container_name: shtab_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: always

volumes:
  postgres_data:
    driver: local
